name: Validate website PR

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed revision
        uses: actions/checkout@v4
      - name: Generate and verify website
        run: |
          python3 -m compileall -q scripts
          python3 scripts/build_site.py
          python3 scripts/build_molecule.py
          python3 scripts/check_site.py
          python3 scripts/check_official_source.py
          git diff --exit-code -- index.html assets/js/molecule-data.js
      - name: Browser viewport and click-to-play smoke test
        run: python3 scripts/check_browser_smoke.py
      - name: Check JavaScript and interactions
        run: |
          for file in assets/js/*.js; do node --check "$file"; done
          node scripts/build_arcade.mjs
          git diff --exit-code -- backend/google-apps-script/Arcade.html
          node scripts/check_interactions.mjs
          node scripts/check_leaderboard.mjs
          node scripts/check_record_client.mjs
